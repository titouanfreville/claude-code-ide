# Reusable build+package workflow. Called by release.yml (tags) and nightly.yml
# (push to main). Builds the `moonlight` binary on 3 targets, packages it, and
# uploads the artifacts for the caller's publish job to attach to a Release.
#
# macOS is packaged as MoonlightCode.app inside a .dmg. Signing + notarization
# run ONLY when the signing secrets are present (see the "Sign & notarize" step);
# otherwise the build is unsigned and still published.
name: build

on:
  workflow_call:
    inputs:
      version:
        description: Version string used in artifact names (e.g. 0.1.0 or nightly-abc1234)
        required: true
        type: string
      tag:
        description: >-
          Release tag the assets will be attached to (e.g. v0.1.0, or `nightly` for
          the rolling pre-release). The extensions embed it in their daemon download
          URL, so it must be the tag that actually ends up holding the assets.
        required: true
        type: string
      ref:
        description: >-
          Git ref to build. Empty means the ref that triggered the run, which is what
          a tag push and a push to main both want. A manual re-run is the exception:
          it is dispatched from a branch, so without this it would rebuild main and
          label the result with a tag it never contained.
        required: false
        default: ''
        type: string

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: build (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    # The desktop app must not be able to stop the extensions shipping. It is the
    # heaviest thing here — GPUI, Metal, Vulkan, a .dmg — and the extensions depend on
    # none of it; they need `daemon` and `vsix`, which are separate jobs. In v0.1.3 a
    # packaging step ran out of disk *after* every target had compiled, and because
    # `publish` needs this whole workflow, six built .vsix and four daemons were thrown
    # away over a .dmg.
    #
    # A silent desktop failure would be its own bug, so release.yml ends with a job
    # that checks the desktop assets actually reached the release and fails the run if
    # they did not — after the extensions are safely out. Loud, but no longer blocking.
    continue-on-error: true
    # Route caller-supplied values through env vars so they are never interpolated
    # directly into run: scripts (avoids shell-injection via a crafted version/tag).
    env:
      VERSION: ${{ inputs.version }}
      TGT: ${{ matrix.target }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: aarch64-apple-darwin
            os: macos-14        # Apple Silicon runner
            kind: macos
          - target: x86_64-apple-darwin
            # macos-13 (the Intel runner image) was retired by GitHub on 2025-12-08.
            # Cross-compile the Intel slice from the Apple Silicon runner instead —
            # rustc/ld64 can produce an x86_64-apple-darwin binary on an arm64 host
            # fine, since nothing here *executes* the target binary.
            os: macos-14
            kind: macos
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            kind: linux
    steps:
      - uses: actions/checkout@v4
        with:
          # Empty falls back to the triggering ref — see the `ref` input.
          ref: ${{ inputs.ref }}

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      # Registry and git checkouts only — not `target/`.
      #
      # GitHub allows a repository 10 GB of cache in total and evicts least-recently-
      # used beyond it. Caching the target dir for three release targets plus four
      # daemon targets put the repo at 9 GB, so each run pushed out the previous run's
      # entries and *every* job then logged "No cache found": the caches were written
      # on every run and read on none. CI's own test jobs, which run on every pull
      # request, were the ones losing the race.
      #
      # These jobs run on a tag or a nightly, so a cold compile costs less than the
      # eviction it causes. Keeping `~/.cargo` still skips the downloads, which is the
      # part that is pure waiting.
      - uses: Swatinem/rust-cache@v2
        with:
          key: release-${{ matrix.target }}
          cache-targets: false

      # GPUI/blade (Vulkan) + alacritty terminal core need these to build on Linux.
      - name: Install Linux system dependencies
        if: matrix.kind == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential cmake clang pkg-config mold \
            libasound2-dev libfontconfig-dev \
            libwayland-dev libxkbcommon-x11-dev \
            libssl-dev libzstd-dev \
            libvulkan-dev libgl1-mesa-dev \
            libxcb-shape0-dev libxcb-xfixes0-dev

      # gpui_macos's build.rs shells out to `xcrun -sdk macosx metal` to compile
      # shaders.metal -> shaders.metallib, during this very build step (both the
      # aarch64/M-series and cross-compiled x86_64 legs). On Xcode 26+ that compiler
      # ships as an optional "Metal Toolchain" component, not bundled by default —
      # but the runner's *default* Xcode may predate that split entirely (no
      # -downloadComponent flag), in which case Metal already just works. Check
      # first so this never fails a runner that doesn't need it.
      - name: Install Metal Toolchain (if needed)
        if: matrix.kind == 'macos'
        run: |
          set -euo pipefail
          if xcrun -sdk macosx metal -v >/dev/null 2>&1; then
            echo "Metal compiler already available — nothing to do."
          elif xcodebuild -help 2>&1 | grep -q -- '-downloadComponent'; then
            sudo xcodebuild -downloadComponent MetalToolchain
          else
            echo "::error::Metal compiler is missing and this Xcode has no -downloadComponent (too old for the Metal Toolchain split). Update the runner's selected Xcode."
            exit 1
          fi

      - name: Build release binary
        run: cargo build --release -p moonlight-desktop --target "$TGT"

      # ---------- Linux packaging: tar.gz of the self-contained binary ----------
      - name: Package (Linux tarball)
        if: matrix.kind == 'linux'
        run: |
          set -euo pipefail
          name="moonlight-${VERSION}-${TGT}"
          mkdir -p "dist/$name"
          cp "target/${TGT}/release/moonlight" "dist/$name/"
          cp README.md "dist/$name/" 2>/dev/null || true
          cp LICENSE* "dist/$name/" 2>/dev/null || true
          # Desktop entry + icon, so an unpacked tarball can register itself with
          # the app grid via `./install.sh ./moonlight` (see packaging/linux).
          cp icon.png "dist/$name/"
          cp packaging/linux/*.desktop packaging/linux/*.sh "dist/$name/"
          tar -C dist -czf "dist/$name.tar.gz" "$name"
          echo "ASSET=dist/$name.tar.gz" >> "$GITHUB_ENV"

      # ---------- macOS packaging: cargo-bundle .app -> (sign) -> .dmg ----------
      - name: Install cargo-bundle
        if: matrix.kind == 'macos'
        run: cargo install cargo-bundle --locked

      - name: Bundle .app
        if: matrix.kind == 'macos'
        # --format osx only: without it cargo-bundle also emits its own throwaway
        # .dmg, which we ignore in favor of the hand-built one below.
        run: cargo bundle --release -p moonlight-desktop --target "$TGT" --format osx

      - name: Sign & notarize (only if signing secrets are set)
        if: matrix.kind == 'macos'
        env:
          MACOS_CERT_P12: ${{ secrets.MACOS_CERT_P12 }}
          MACOS_CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
          MACOS_SIGN_IDENTITY: ${{ secrets.MACOS_SIGN_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
        run: |
          set -euo pipefail
          APP="target/${TGT}/release/bundle/osx/MoonlightCode.app"
          if [ -z "${MACOS_CERT_P12:-}" ]; then
            echo "::warning::No signing secrets set — producing an UNSIGNED build."
            exit 0
          fi
          # Import the Developer ID cert into a throwaway keychain.
          KEYCHAIN="$RUNNER_TEMP/build.keychain"
          KEYCHAIN_PW="$(uuidgen)"
          echo "$MACOS_CERT_P12" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security create-keychain -p "$KEYCHAIN_PW" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PW" "$KEYCHAIN"
          security import "$RUNNER_TEMP/cert.p12" -k "$KEYCHAIN" -P "$MACOS_CERT_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PW" "$KEYCHAIN"
          security list-keychains -d user -s "$KEYCHAIN" login.keychain
          rm -f "$RUNNER_TEMP/cert.p12"
          # Sign with hardened runtime (required for notarization).
          codesign --deep --force --options runtime --timestamp \
            --sign "$MACOS_SIGN_IDENTITY" "$APP"
          codesign --verify --strict --verbose=2 "$APP"

      # `hdiutil` needs room for a staged copy of the .app plus the compressed image,
      # and a release build of a GPUI app leaves little of a macOS runner's disk. v0.1.3
      # failed here with "hdiutil: create failed - No space left on device" — after a
      # successful build, so the release shipped nothing over a packaging step.
      #
      # The intermediates are what go: once the bundle exists, `deps/`, `build/` and
      # `incremental/` are spent. Deliberately after `cargo bundle` — removing them
      # before it would make cargo rebuild the whole thing.
      # Diagnostics only — the disk is not the problem, and two earlier attempts to
      # "fix" this by freeing space were treating the symptom's wording rather than its
      # cause. See the sizing note on the .dmg step below.
      #
      # `/System/Volumes/Data` deliberately: `/` on macOS is the sealed, read-only
      # system volume, so `df /` reports a filesystem nothing in this job writes to.
      # That is what made the first attempt look like it should have worked.
      - name: Disk before packaging
        if: matrix.kind == 'macos'
        run: df -h /System/Volumes/Data | tail -1

      - name: Build .dmg
        if: matrix.kind == 'macos'
        run: |
          set -euo pipefail
          APP="target/${TGT}/release/bundle/osx/MoonlightCode.app"
          name="MoonlightCode-${VERSION}-${TGT}"
          mkdir -p dist dmg-staging
          # A real copy, not a symlink: `hdiutil -srcfolder` preserves symlinks rather
          # than following them, so staging the .app by link would produce a .dmg
          # containing a dangling one. The `/Applications` link below is meant to stay
          # a link — that is the drag-to-install target.
          cp -R "$APP" dmg-staging/
          ln -s /Applications dmg-staging/Applications
          # Sized explicitly, with headroom.
          #
          # Left to itself, `hdiutil create -srcfolder` computes the image size from
          # the source and gets it slightly wrong — filesystem metadata is not free,
          # and the estimate does not allow enough for it. It then fails *copying into
          # the image it just made*, and reports that as "No space left on device".
          #
          # Which is why this looked like a full disk for three attempts: the message
          # names a device, and the device is the image, not the volume. The runner had
          # 36 GiB free at the point of failure. It is marginal, so it alternated
          # between the two macOS legs run to run depending on which app was fractionally
          # larger — which is also what makes it read as flakiness rather than a bug.
          #
          # `du -ms` follows the real content; +64 MiB covers the metadata and leaves
          # room for the app to grow. `-format UDZO` compresses afterwards, so the
          # slack costs nothing in the published artifact.
          size_mb=$(( $(du -ms dmg-staging | cut -f1) + 64 ))
          echo "staging $(du -sh dmg-staging | cut -f1), creating a ${size_mb}m image"
          hdiutil create -volname "MoonlightCode" -srcfolder dmg-staging \
            -size "${size_mb}m" -ov -format UDZO "dist/$name.dmg"
          ls -lh "dist/$name.dmg"
          echo "ASSET=dist/$name.dmg" >> "$GITHUB_ENV"

      - name: Notarize .dmg (only if signing secrets are set)
        if: matrix.kind == 'macos'
        env:
          MACOS_CERT_P12: ${{ secrets.MACOS_CERT_P12 }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -z "${MACOS_CERT_P12:-}" ]; then exit 0; fi
          xcrun notarytool submit "$ASSET" \
            --apple-id "$APPLE_ID" --team-id "$APPLE_TEAM_ID" \
            --password "$APPLE_APP_PASSWORD" --wait
          xcrun stapler staple "$ASSET"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: moonlight-${{ matrix.target }}
          path: ${{ env.ASSET }}
          if-no-files-found: error

  # --------------------------------------------------------------------------
  # The headless daemon, for the editor extensions.
  #
  # Separate from `build` on purpose: `moonlight-desktop` needs GPUI, Metal and
  # Vulkan and is therefore limited to the three targets that can build it, while
  # `moonlightd` is headless (see apps/daemon/Cargo.toml) and builds on more of
  # them. The VS Code extensions only ever need this binary, so tying their platform
  # support to the desktop app's would strand Linux arm64 users for a reason that has
  # nothing to do with them.
  #
  # Each target gets a runner of its own architecture where one exists, because
  # `rusqlite` is vendored with `bundled` and every target therefore also compiles
  # SQLite's C sources — a native toolchain avoids maintaining cross-linker setups for
  # each of them.
  #
  # The exception is `x86_64-apple-darwin`, built on the arm64 `macos-14` runner:
  # GitHub retired the Intel macOS image, and clang targets both slices, so this leg is
  # a genuine cross-compile. Said explicitly because the first version of this comment
  # claimed every target was native, which is the kind of false assurance that stops
  # someone looking when an Intel-only failure shows up.
  # --------------------------------------------------------------------------
  daemon:
    name: daemon (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    env:
      VERSION: ${{ inputs.version }}
      TGT: ${{ matrix.target }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: aarch64-apple-darwin
            os: macos-14
          - target: x86_64-apple-darwin
            os: macos-14
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-24.04-arm
          # No Windows leg yet. `moonlight-control` serves the hook ControlServer
          # over a Unix domain socket (`UnixListener`, `os::unix`,
          # `Permissions::from_mode`), so the daemon does not compile for
          # x86_64-pc-windows-msvc at all. Windows needs a second transport — a named
          # pipe, or loopback TCP with a token — and a matching change to how hooks
          # are registered; that touches the hook security boundary and belongs in its
          # own change, not in a release matrix. The extension already handles the
          # absence: with no Windows entry in the pins, `planInstall` reports
          # `unsupported-platform` rather than reaching for an asset that is not there.
    steps:
      - uses: actions/checkout@v4
        with:
          # Empty falls back to the triggering ref — see the `ref` input.
          ref: ${{ inputs.ref }}

      # A versioned release that already holds this daemon keeps it: re-running a tag
      # reuses the published bytes instead of building new ones.
      #
      # v0.1.3 is why. It was re-run several times; every run rebuilt the daemons and
      # overwrote the release assets, while the marketplaces kept the first run's
      # extensions (an already-live version is skipped). The published extension then
      # pinned hashes for bytes the release no longer had, and every fresh install
      # failed its checksum. Reusing the asset makes the pins of any re-run agree with
      # what was published first.
      #
      # Not for `nightly`: that tag is rolling and its assets are named per commit, so
      # an existing asset under it is never this run's.
      - name: Reuse the daemon this release already published
        id: reuse
        if: inputs.tag != 'nightly'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          mkdir -p dist
          asset="moonlightd-${VERSION}-${TGT}.gz"
          if gh release download "$TAG" --repo "$GITHUB_REPOSITORY" -p "$asset" -D dist 2>/dev/null; then
            echo "::notice::reusing $asset already published on $TAG"
            echo "hit=true" >> "$GITHUB_OUTPUT"
          else
            echo "hit=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: dtolnay/rust-toolchain@stable
        if: steps.reuse.outputs.hit != 'true'
        with:
          targets: ${{ matrix.target }}

      # Registry only, same reasoning as the release job above: four more multi-GB
      # target caches is what pushed the repo over its 10 GB allowance.
      - uses: Swatinem/rust-cache@v2
        if: steps.reuse.outputs.hit != 'true'
        with:
          key: daemon-${{ matrix.target }}
          cache-targets: false

      - name: Build moonlightd
        if: steps.reuse.outputs.hit != 'true'
        run: cargo build --release -p moonlight-daemon --target "$TGT"
        shell: bash

      # Gzip rather than tar: the extension fetches exactly one file and gunzips it
      # in process, so an archive format would only add an extraction step that has
      # to behave identically on three platforms.
      #
      # `-n` keeps the input's name and mtime out of the header, so the asset hash
      # depends on the binary alone rather than on when this runner wrote it.
      - name: Package daemon
        if: steps.reuse.outputs.hit != 'true'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          bin="target/${TGT}/release/moonlightd"
          [ -f "$bin" ] || bin="target/${TGT}/release/moonlightd.exe"
          gzip -9 -n -c "$bin" > "dist/moonlightd-${VERSION}-${TGT}.gz"

      - uses: actions/upload-artifact@v4
        with:
          name: moonlightd-${{ matrix.target }}
          path: dist/moonlightd-${{ inputs.version }}-${{ matrix.target }}.gz
          if-no-files-found: error

  # --------------------------------------------------------------------------
  # The VS Code / Open VSX extensions.
  #
  # Runs after `daemon` because `pin-daemon.js` hashes the artifacts that job just
  # produced and writes them into the extension. The hashes therefore describe the
  # exact bytes this same release publishes — a checksum file fetched from the
  # release at runtime would only ever agree with itself.
  # --------------------------------------------------------------------------
  vsix:
    name: vsix
    needs: daemon
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      VERSION: ${{ inputs.version }}
      TAG: ${{ inputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          # Empty falls back to the triggering ref — see the `ref` input.
          ref: ${{ inputs.ref }}

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - uses: actions/download-artifact@v4
        with:
          path: daemon-artifacts
          pattern: moonlightd-*
          merge-multiple: true

      - name: Install
        working-directory: clients/vscode
        run: npm ci

      - name: Pin the daemon build the extensions may download
        working-directory: clients/vscode
        run: node scripts/pin-daemon.js "$VERSION" "$TAG" "$GITHUB_WORKSPACE/daemon-artifacts"

      - name: Test
        working-directory: clients/vscode
        run: npm test

      - name: Package
        working-directory: clients/vscode
        run: npm run package

      # Flattened because both publish jobs attach `artifacts/*`: left nested, the
      # glob would match the per-extension directories rather than the .vsix files.
      - name: Collect the packages
        run: |
          set -euo pipefail
          mkdir -p vsix
          find clients/vscode/extensions -name '*.vsix' -exec cp {} vsix/ \;
          ls -l vsix

      - uses: actions/upload-artifact@v4
        with:
          name: vsix
          path: vsix/*.vsix
          if-no-files-found: error

  # --------------------------------------------------------------------------
  # The JetBrains plugins (PyCharm, IntelliJ, ...).
  #
  # Pinned from the same daemon artifacts as the .vsix, by the same script, so both
  # clients of one release trust exactly one set of bytes. Without this job the core
  # plugin had no `daemon-pins.json` at all and could never install a daemon.
  # --------------------------------------------------------------------------
  jetbrains:
    name: jetbrains
    needs: daemon
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      VERSION: ${{ inputs.version }}
      TAG: ${{ inputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          # Empty falls back to the triggering ref — see the `ref` input.
          ref: ${{ inputs.ref }}

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      # The IntelliJ Platform Gradle Plugin needs JDK 21 (see mise.toml).
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v4

      - uses: actions/download-artifact@v4
        with:
          path: daemon-artifacts
          pattern: moonlightd-*
          merge-multiple: true

      # No `npm ci`: pin-daemon.js uses only Node built-ins.
      - name: Pin the daemon build the plugins may download
        working-directory: clients/vscode
        run: node scripts/pin-daemon.js "$VERSION" "$TAG" "$GITHUB_WORKSPACE/daemon-artifacts"

      # `pluginVersion` from the workflow rather than gradle.properties, so the nightly's
      # `nightly-<sha>` and a tag's version both land in the zips' names and descriptors.
      - name: Test and build
        working-directory: clients/jetbrains
        run: ./gradlew --no-daemon test buildPlugin -PpluginVersion="$VERSION"

      - name: Collect the plugins
        run: |
          set -euo pipefail
          mkdir -p jetbrains
          find clients/jetbrains/plugins -path '*/build/distributions/*.zip' -exec cp {} jetbrains/ \;
          ls -l jetbrains

      - uses: actions/upload-artifact@v4
        with:
          name: jetbrains
          path: jetbrains/*.zip
          if-no-files-found: error
