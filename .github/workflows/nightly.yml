# Nightly build: every push to main builds all targets and updates a single rolling
# "nightly" pre-release whose assets are replaced each run. Not a versioned release.
name: nightly

on:
  push:
    branches: [main]

# Cancel an in-flight nightly if a newer push lands.
concurrency:
  group: nightly
  cancel-in-progress: true

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
    steps:
      - id: v
        env:
          SHA: ${{ github.sha }}
        run: echo "version=nightly-${SHA:0:7}" >> "$GITHUB_OUTPUT"

  build:
    needs: version
    uses: ./.github/workflows/build.yml
    secrets: inherit
    with:
      version: ${{ needs.version.outputs.version }}
      tag: nightly

  publish:
    needs: [version, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      # Move the rolling `nightly` tag to this commit and clear the old release so
      # stale assets don't linger. `|| true` keeps the first-ever run from failing.
      - name: Reset nightly release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release delete nightly --cleanup-tag --yes || true

      - name: Publish nightly pre-release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: nightly
          name: Nightly (${{ needs.version.outputs.version }})
          prerelease: true
          target_commitish: ${{ github.sha }}
          body: "Rolling nightly build from `main` (${{ needs.version.outputs.version }}). Unstable."
          fail_on_unmatched_files: true
          files: artifacts/*
