name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  # Formatting + domain-purity are OS-independent — run once on Linux (cheapest).
  format:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Format
        run: cargo fmt --all -- --check
      - name: Domain purity (no tokio/io/gpui in domain)
        # Comments stripped first. The manifest documents the rule in a comment that
        # names the very crates it forbids — "NO tokio, NO I/O, NO GPUI (enforced in
        # CI)" — so the check was failing on its own explanatory note while the
        # dependency list was clean. A gate that fires on prose teaches people to
        # ignore it.
        run: |
          ! sed 's/#.*//' crates/domain/Cargo.toml \
            | grep -E '(^|[^-])(tokio|gpui|reqwest|sqlx|rusqlite)\b' \
            || (echo "domain must stay pure (no I/O/runtime/UI deps)"; exit 1)

  # Clippy + tests on both platforms — the app must support macOS and Linux, and
  # platform-gated code (Metal vs Vulkan, PTY, etc.) only compiles on its own OS.
  test:
    name: test (${{ matrix.os }})
    timeout-minutes: 60
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      # The one place a full `target/` cache earns its keep: this job runs on every
      # pull request and spends ~10 min (Linux) to ~16 min (macOS) compiling, because
      # `cargo test --all` includes the GPUI desktop app. The release and daemon jobs
      # now cache only `~/.cargo`, so these two entries stay inside the repo's 10 GB
      # allowance instead of being evicted before the next run reads them.
      - uses: Swatinem/rust-cache@v2
        with:
          key: ci-${{ matrix.os }}

      # GPUI/blade (Vulkan) + alacritty terminal core need these to build on Linux.
      - name: Install Linux system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential cmake clang pkg-config mold \
            libasound2-dev libfontconfig-dev \
            libwayland-dev libxkbcommon-x11-dev \
            libssl-dev libzstd-dev \
            libvulkan-dev libgl1-mesa-dev \
            libxcb-shape0-dev libxcb-xfixes0-dev

      # gpui_macos's build.rs shells out to `xcrun -sdk macosx metal` to compile
      # shaders.metal. On Xcode 26+ that compiler is an optional "Metal Toolchain"
      # download — but the runner's default Xcode may predate that split entirely
      # (no -downloadComponent flag), in which case Metal already just works. Check
      # first so this never fails a runner that doesn't need it.
      - name: Install Metal Toolchain (if needed)
        if: runner.os == 'macOS'
        run: |
          set -euo pipefail
          if xcrun -sdk macosx metal -v >/dev/null 2>&1; then
            echo "Metal compiler already available — nothing to do."
          elif xcodebuild -help 2>&1 | grep -q -- '-downloadComponent'; then
            sudo xcodebuild -downloadComponent MetalToolchain
          else
            echo "::error::Metal compiler is missing and this Xcode has no -downloadComponent (too old for the Metal Toolchain split). Update the runner's selected Xcode."
            exit 1
          fi

      - name: Clippy (deny warnings)
        run: cargo clippy --all-targets --all-features -- -D warnings
      - name: Test
        run: cargo test --all

  # The VS Code extensions, on every pull request.
  #
  # Until now `npm test` ran in exactly one place: the `vsix` job inside build.yml,
  # which runs only on a tag or a push to main. So the TypeScript was neither compiled
  # nor tested on any PR — a broken `ownership.test.ts`, or code that does not typecheck
  # at all, reached main green and surfaced mid-release, in the middle of the publish
  # sequence those very tests exist to make trustworthy.
  #
  # `npm test` runs `npm run compile` first, so this is the type check as well.
  vscode:
    name: vscode extensions
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install
        working-directory: clients/vscode
        run: npm ci
      - name: Test
        working-directory: clients/vscode
        run: npm test
      # Reported, not enforced: advisories appear without anything in this repo
      # changing, and a PR turned red by someone else's publish is how a security
      # signal gets trained away.
      - name: Audit
        working-directory: clients/vscode
        continue-on-error: true
        run: npm audit --audit-level=high
