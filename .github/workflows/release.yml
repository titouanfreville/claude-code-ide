# Versioned release: push a tag like `v0.1.0` -> builds all targets and publishes
# a GitHub Release with the .dmg (macOS arm64 + x86_64) and Linux .tar.gz attached.
name: release

on:
  push:
    tags:
      - "v*"
  # Re-run a release by hand — for a run that failed halfway, or one whose publish
  # was skipped because a token was missing or expired. Rebuilds from the tag, so it
  # produces the same artifacts rather than whatever main has drifted to since.
  workflow_dispatch:
    inputs:
      tag:
        description: Existing tag to build and release from (e.g. v0.1.1)
        required: true
        type: string
      skip:
        description: >-
          Comma-separated extension names to leave out of the marketplace publish, for
          re-running a release whose publish half-succeeded. Optional: a version the
          marketplace already has is reported as a warning and skipped.
        required: false
        default: ''
        type: string

permissions:
  contents: read

# Queue, never cancel. `workflow_dispatch` means a hand-dispatched repair can now
# overlap the tag-push run for the same tag; both reach `marketplace`, both call
# `vsce publish` for the same version, and the loser fails partway through — leaving
# exactly the half-published state `publish-marketplace.yml`'s `--skip` exists to clean
# up. Cancelling instead would be worse: it can stop a publish mid-sequence.
concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  version:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      version: ${{ steps.v.outputs.version }}
      tag: ${{ steps.v.outputs.tag }}
    steps:
      # The tag comes from the ref on a tag push and from the input on a manual run;
      # the version is that tag without its leading `v` (v0.1.0 -> 0.1.0).
      - id: v
        env:
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"

  build:
    needs: version
    uses: ./.github/workflows/build.yml
    secrets: inherit
    with:
      version: ${{ needs.version.outputs.version }}
      tag: ${{ needs.version.outputs.tag }}
      # On a tag push this is the tag anyway; on a manual run it is what stops the
      # build from silently using the branch it was dispatched from.
      ref: ${{ needs.version.outputs.tag }}

  publish:
    needs: [version, build]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.version.outputs.tag }}
          name: MoonlightCode ${{ needs.version.outputs.version }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: artifacts/*

  # --------------------------------------------------------------------------
  # Do the extensions trust the daemons the release actually holds?
  #
  # v0.1.3 shipped extensions pinned to daemons the release no longer had: a re-run
  # replaced the assets, the marketplaces kept the first run's extensions, and every
  # fresh install failed its checksum. build.yml now reuses published daemons, and this
  # proves it worked — the hashes come from the *release*, re-downloaded, not from this
  # run's artifacts, so it checks what an installing user will fetch.
  #
  # Gates both marketplace jobs: a mismatch must stop before anything installable is out.
  # --------------------------------------------------------------------------
  verify-pins:
    needs: [version, publish]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: '{vsix,jetbrains}'
          path: packages
          merge-multiple: true

      - name: Check every pinned hash against the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.version.outputs.tag }}
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          set -euo pipefail
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" -p 'moonlightd-*.gz' -D released
          # The pins as each client will read them: the bundled extension source, and
          # the JSON resource inside the core plugin's jar.
          unzip -p "packages/moonlight-core-${VERSION}.vsix" 'extension/dist/extension.js' > vsix-pins.txt
          sources=(vsix-pins.txt)
          # The JetBrains build is `continue-on-error`, so its absence is a warning, not
          # a reason to hold back the VS Code publish. A zip that *is* there must pin
          # correctly — `jetbrains-marketplace` would otherwise ship a broken install.
          if [ -f "packages/moonlight-core-${VERSION}.zip" ]; then
            unzip -q -o "packages/moonlight-core-${VERSION}.zip" -d core-plugin
            for jar in core-plugin/*/lib/*.jar; do
              unzip -p "$jar" moonlight/daemon-pins.json 2>/dev/null || true
            done > jetbrains-pins.json
            [ -s jetbrains-pins.json ] || { echo "::error::the core JetBrains plugin carries no daemon-pins.json"; exit 1; }
            sources+=(jetbrains-pins.json)
          else
            echo "::warning::no JetBrains plugins in this release — checking the VS Code pins only."
          fi
          bad=0
          for gz in released/*.gz; do
            asset="$(sha256sum "$gz" | cut -d' ' -f1)"
            binary="$(gunzip -c "$gz" | sha256sum | cut -d' ' -f1)"
            for pins in "${sources[@]}"; do
              for h in "$asset" "$binary"; do
                if ! grep -qF "$h" "$pins"; then
                  echo "::error::$(basename "$gz"): $h is not pinned in $pins"
                  bad=1
                fi
              done
            done
          done
          [ "$bad" = 0 ] && echo "all $(ls released | wc -l) daemons match both clients' pins"
          exit "$bad"

  # --------------------------------------------------------------------------
  # Marketplace publish.
  #
  # Publishes the .vsix that `build` produced, never a locally packaged one: the
  # repo keeps DAEMON_PINS undefined, so an extension packaged outside this
  # workflow installs fine and then never fetches a daemon. `--packagePath` is
  # what makes that impossible to get wrong.
  #
  # Needs `publish` so the assets are on the release before the extensions that
  # download them are installable — the reverse order gives whoever installs in
  # the first minutes an extension whose daemon 404s.
  #
  # Skips itself when the token is absent, the same way the macOS signing step
  # does: a fork, or a repo whose secrets are not set yet, still gets a full
  # release with the .vsix attached, just not a published one.
  # --------------------------------------------------------------------------
  marketplace:
    needs: [version, build, publish, verify-pins]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      # The tag, not the dispatching branch: this checkout only supplies the lockfile
      # that `npm ci` installs vsce/ovsx from, and those should be the versions the
      # release was built with.
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.version.outputs.tag }}

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - uses: actions/download-artifact@v4
        with:
          name: vsix
          path: vsix

      - name: Install publishing tools
        working-directory: clients/vscode
        run: npm ci

      # Dependency order, not alphabetical — see scripts/publish-order.js. Publishing
      # in glob order put the pack second, before the extensions it packs, and the
      # marketplace rejected it.
      - name: Publish to the VS Marketplace
        working-directory: clients/vscode
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
          SKIP: ${{ inputs.skip }}
        run: |
          set -euo pipefail
          # A missing token is only benign when nobody configured one — a fork, or a
          # repo before its secrets are set. On a tag push in a repo that has published
          # before, it is an expired PAT, and warning past it produced a green run that
          # shipped nothing: the exact failure publish-marketplace.yml was written to
          # repair. `github.event_name` tells the two apart.
          if [ -z "${VSCE_PAT:-}" ]; then
            if [ "${GITHUB_EVENT_NAME}" = "workflow_dispatch" ]; then
              echo "::error::VSCE_PAT is not set — this run was asked to publish."
              exit 1
            fi
            echo "::warning::VSCE_PAT is not set — skipping the VS Marketplace publish."
            exit 0
          fi
          # Fails on a bad or expired token before anything is live, rather than
          # partway through a set where some extensions already published.
          ./node_modules/.bin/vsce verify-pat titouanfreville
          args=()
          [ -n "${SKIP:-}" ] && args=(--skip "$SKIP")
          node scripts/publish-order.js "$GITHUB_WORKSPACE/vsix" "${args[@]}" | while read -r pkg; do
            echo "--> $(basename "$pkg")"
            scripts/publish-vsix.sh vsce "$pkg"
          done

      - name: Publish to Open VSX
        working-directory: clients/vscode
        env:
          OVSX_PAT: ${{ secrets.OVSX_PAT }}
          SKIP: ${{ inputs.skip }}
        run: |
          set -euo pipefail
          if [ -z "${OVSX_PAT:-}" ]; then
            echo "::warning::OVSX_PAT is not set — skipping the Open VSX publish."
            exit 0
          fi
          # Open VSX rejects a publish into a namespace that does not exist yet, and
          # unlike the VS Marketplace it is not created by registering a publisher.
          # Tolerated only for "it already exists": swallowing every failure hid an
          # authentication error behind the benign case, in a job that goes to the
          # trouble of verifying the other registry's token first.
          if ! ./node_modules/.bin/ovsx create-namespace titouanfreville 2>namespace.err; then
            grep -qiE "already (exists|owned)" namespace.err \
              || { echo "::error::could not create the Open VSX namespace:"; cat namespace.err; exit 1; }
            echo "namespace titouanfreville already exists"
          fi
          args=()
          [ -n "${SKIP:-}" ] && args=(--skip "$SKIP")
          # No `-p`: ovsx reads OVSX_PAT from the environment, and passing it as an
          # argument puts a live marketplace token in the process argument list.
          node scripts/publish-order.js "$GITHUB_WORKSPACE/vsix" "${args[@]}" | while read -r pkg; do
            echo "--> $(basename "$pkg")"
            scripts/publish-vsix.sh ovsx "$pkg"
          done

  # --------------------------------------------------------------------------
  # JetBrains Marketplace publish.
  #
  # Uploads the zips `build` produced, for the same reason the VS Code job uses
  # `--packagePath`: only those carry the daemon pins. Through the upload API rather
  # than `gradlew publishPlugin`, which would rebuild — and a rebuilt plugin is not the
  # one `verify-pins` checked.
  #
  # The API only accepts updates: each plugin's first version has to be uploaded by
  # hand on plugins.jetbrains.com. Skips itself without a token, like the others.
  # --------------------------------------------------------------------------
  jetbrains-marketplace:
    needs: [version, build, publish, verify-pins]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      # `pattern`, not `name`: a named download fails when the artifact is absent, and
      # a failed JetBrains build is allowed to leave it absent.
      - uses: actions/download-artifact@v4
        with:
          pattern: jetbrains
          path: jetbrains
          merge-multiple: true

      - name: Publish to the JetBrains Marketplace
        env:
          JETBRAINS_MARKETPLACE_TOKEN: ${{ secrets.JETBRAINS_MARKETPLACE_TOKEN }}
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          set -euo pipefail
          # Always a warning, even on a manual run: unlike VSCE_PAT, an unset token is
          # the expected state until each plugin's first version is uploaded by hand.
          if [ -z "${JETBRAINS_MARKETPLACE_TOKEN:-}" ]; then
            echo "::warning::JETBRAINS_MARKETPLACE_TOKEN is not set — skipping the JetBrains Marketplace publish."
            exit 0
          fi
          if ! ls jetbrains/*.zip >/dev/null 2>&1; then
            echo "::warning::no JetBrains plugins were built — nothing to publish."
            exit 0
          fi
          # Core first: every other plugin depends on it, and a dependant whose
          # dependency is not yet available at this version is not installable.
          for name in core status session-control agentic-support ai-review; do
            zip="jetbrains/moonlight-${name}-${VERSION}.zip"
            echo "--> $(basename "$zip")"
            # The token goes in a header read from the environment, not on the
            # command line where it would sit in the process list.
            curl -fsS --retry 3 \
              -H @<(printf 'Authorization: Bearer %s\n' "$JETBRAINS_MARKETPLACE_TOKEN") \
              -F "xmlId=io.github.titouanfreville.moonlight.${name}" \
              -F "file=@${zip}" \
              https://plugins.jetbrains.com/plugin/uploadPlugin
            echo
          done

  # --------------------------------------------------------------------------
  # Did the desktop app actually ship?
  #
  # `build` is `continue-on-error`, so a failed desktop target no longer stops the
  # extensions reaching the marketplaces. That trade is only safe if the failure is
  # still impossible to miss — otherwise a release quietly goes out without the
  # macOS or Linux desktop build and nobody notices until someone tries to download
  # it.
  #
  # So this runs last, after the artifacts are attached and the extensions are
  # published, and fails the run when an expected asset is absent. The release is
  # real and the extensions are out; the run is red and says exactly what is missing.
  # --------------------------------------------------------------------------
  verify-desktop:
    # `marketplace` included so this genuinely runs last, as its comment claims. With
    # only [version, publish] it ran *concurrently* with the publish it says it follows,
    # so a red result could land while extensions were still going out — and anyone
    # reasoning "the run is red, so nothing shipped" would have been wrong.
    needs: [version, publish, marketplace, jetbrains-marketplace]
    if: always() && needs.publish.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Check the desktop assets reached the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.version.outputs.tag }}
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          set -euo pipefail
          # `--repo` because this job checks out nothing: `gh` otherwise infers the
          # repository from git remotes and fails with "not a git repository", which
          # this job then reported as a missing asset.
          assets="$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json assets -q '.assets[].name')"
          echo "$assets"
          missing=0
          for expected in \
            "MoonlightCode-${VERSION}-aarch64-apple-darwin.dmg" \
            "MoonlightCode-${VERSION}-x86_64-apple-darwin.dmg" \
            "moonlight-${VERSION}-x86_64-unknown-linux-gnu.tar.gz"; do
            if ! printf '%s\n' "$assets" | grep -qxF "$expected"; then
              echo "::error::missing desktop asset: $expected"
              missing=1
            fi
          done
          exit "$missing"
