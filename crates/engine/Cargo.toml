[package]
name = "moonlight-engine"
edition.workspace = true
version.workspace = true
license.workspace = true
authors.workspace = true
rust-version.workspace = true

# Core orchestrator: session supervisor, phase machine, event bus, governor.
# Depends on domain (ports only). Implemented slice-by-slice.
[dependencies]
moonlight-domain.workspace = true
tokio.workspace = true
tracing.workspace = true
async-trait.workspace = true
# `EngineEvent` crosses the process boundary so a client IDE folds the daemon's facts
# rather than running a second engine and arriving at its own answer.
serde = { workspace = true, features = ["derive"] }
