[package]
name = "moonlight-core"
edition.workspace = true
version.workspace = true
license.workspace = true
authors.workspace = true
rust-version.workspace = true

# Cross-cutting: config, logging/tracing setup, secrets, shared utils.
[dependencies]
tracing.workspace = true
tracing-subscriber.workspace = true
# The Claude-observability read model (`obs`): statusline snapshots off disk and the
# account usage quota off Anthropic's OAuth usage endpoint, shared by the desktop app
# and the headless daemon so both report the same figures.
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
