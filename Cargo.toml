# MoonlightCode — Cargo workspace (single repo, single `cargo build`)
# Layout mirrors .bmad-output/planning/architecture.md (hexagonal, domain-first).
[workspace]
resolver = "2"
members = [
    "crates/domain",
    "crates/core",
    "crates/engine",
    "crates/detection",
    "crates/control",
    "crates/trust",
    "crates/persistence",
    "crates/worktree",
    "crates/rtk",
    "crates/mcp-server",
    "apps/desktop",
    "apps/daemon",
]

# Everything except the desktop app, which needs the Metal Toolchain to build its
# GPUI renderer. Without this, a plain `cargo build`/`cargo test` fails on any machine
# that hasn't installed it — even when the change is entirely headless. Build the
# desktop explicitly with `-p moonlight-desktop`.
default-members = [
    "crates/domain",
    "crates/core",
    "crates/engine",
    "crates/detection",
    "crates/control",
    "crates/trust",
    "crates/persistence",
    "crates/worktree",
    "crates/rtk",
    "crates/mcp-server",
    "apps/daemon",
]
[workspace.package]
edition = "2021"
version = "0.1.2"
license = "MIT"
authors = ["Titouan"]
rust-version = "1.77"

# Shared dependency versions, referenced by member crates via `*.workspace = true`.
[workspace.dependencies]
thiserror = "2"
async-trait = "0.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
anyhow = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "process", "fs", "time", "io-util"] }
# Blocking HTTP client for the agent's `http_request` verb (run via spawn_blocking);
# reuses the rustls already in the tree. Small dep surface for a gated dev tool.
ureq = "2"

# gRPC client stack for the gRPC request builder (center tab). ureq is HTTP/1.1-only,
# so gRPC needs its own HTTP/2 transport — but hyper 1.x / h2 0.4 / tower 0.5 / rustls
# are ALREADY in the lockfile (the MCP server's `serve_http`), and tonic 0.14 pins
# exactly those, so this unifies with the existing tree rather than duplicating it.
# We deliberately skip `codegen`/`router`/`server` and the `tonic-prost` codec: the
# panel calls methods discovered at RUNTIME, so it carries its own dynamic codec
# (`grpc::DynamicCodec`) instead of build-time-generated stubs.
tonic = { version = "0.14", default-features = false, features = ["channel", "tls-ring", "tls-native-roots"] }
prost = "0.14"
# Runtime protobuf reflection: builds messages from descriptors discovered over gRPC
# server reflection (or from .proto), and converts them to/from JSON. Ships NO default
# features — `serde` is what provides the JSON bridge both directions.
prost-reflect = { version = "0.16", features = ["serde"] }
# Pure-Rust .proto compiler for the fallback when a server has reflection disabled.
# Replaces the `protoc` binary entirely, so no external toolchain is required.
protox = "0.9"
# `ReceiverStream` for the request side of the reflection call (`ServerReflectionInfo`
# is bidi-streaming, so tonic needs a `Stream` to feed it). Already in the lockfile via
# the existing tower/hyper stack — this pins no new version.
tokio-stream = "0.1"

# GPUI desktop UI stack. `gpui`/`gpui_platform` are declared branchless to match
# how `gpui-component` declares them — this keeps a SINGLE zed git source so all
# zed crates unify on one checkout. The exact commit is pinned in Cargo.lock
# (zed `4bee412…` — the rev gpui-component's own lockfile is tested against);
# `cargo update -p gpui --precise <sha>` re-pins it. Do NOT use `rev =` here: a
# `rev` source and gpui-component's branchless source would NOT unify, pulling two
# incompatible `gpui` builds (API drift breaks gpui-component's own code).
gpui = { git = "https://github.com/zed-industries/zed" }
# `wayland`/`x11` are REQUIRED on Linux: zed's workspace pulls `gpui_linux` with
# `default-features = false`, so neither backend compiles unless re-enabled here
# (gpui_platform forwards these features to gpui_linux). Without them
# `current_platform()` hits `unreachable!()` in gpui_linux/src/linux.rs —
# `guess_compositor()` reports X11/Wayland but only the `Headless` arm exists.
# Harmless elsewhere: the gpui_linux dep is `cfg(target_os = "linux")`-gated.
gpui_platform = { git = "https://github.com/zed-industries/zed", features = ["font-kit", "wayland", "x11"] }
# `tree-sitter-languages` enables the bundled grammars so the code-editor panel
# actually syntax-highlights (rust/ts/go/py/json/…); without it `code_editor(lang)`
# resolves to no grammar (langs are `#[cfg(feature)]`-gated) and renders plain.
gpui-component = { git = "https://github.com/longbridge/gpui-component", rev = "277f220a6196572116a8fd84fba6c36187094cab", features = ["tree-sitter-languages"] }

# Terminal emulator core (PTY + ANSI parser + grid state) for the IDE-classic
# manual terminal panel. Pinned to Zed's known-good alacritty fork rev so it stays
# compatible with the pinned gpui ecosystem. alacritty_terminal is Apache-2.0 — we
# use ONLY its public API; Zed's GPL terminal/terminal_view crates are not used.
alacritty_terminal = { git = "https://github.com/zed-industries/alacritty", rev = "9d9640d4" }

# Line-level diffing for the review surface's two-pane view. `git/diff.rs` only
# *parses* diffs git produced; a before/after pane alignment has to be computed
# from two full texts, which git's unified output can't express. Pure Rust.
similar = "3"

# SQLite driver for the DB-observer panel (read-only browse). `bundled` compiles
# SQLite in-tree so there's no system libsqlite dependency.
rusqlite = { version = "0.32", features = ["bundled"] }
# Synchronous Postgres driver for the DB-observer panel (read-only browse). Blocking
# (libpq-free, pure Rust) so the panel runs it on the background executor like SQLite.
postgres = "0.19"

# Internal crates
moonlight-domain = { path = "crates/domain" }
moonlight-core = { path = "crates/core" }
moonlight-engine = { path = "crates/engine" }
moonlight-detection = { path = "crates/detection" }
moonlight-control = { path = "crates/control" }
moonlight-trust = { path = "crates/trust" }
moonlight-persistence = { path = "crates/persistence" }
moonlight-worktree = { path = "crates/worktree" }
moonlight-rtk = { path = "crates/rtk" }
moonlight-mcp-server = { path = "crates/mcp-server" }

[profile.dev]
# Faster incremental dev builds; GPUI is heavy so keep opt-level low for our crates.
opt-level = 0

# …but NOT for dependencies. GPUI, wgpu and the terminal core do the per-frame
# layout, shaping and grid work, and unoptimized they saturate the UI thread — a
# dev build renders on the GPU perfectly well and still feels slow to type in.
# Dependencies are compiled once and rarely change, so paying for -O3 here costs a
# single long build and leaves `cargo run` on our own crates as fast as before.
[profile.dev.package."*"]
opt-level = 3

[profile.release]
opt-level = 3
lto = "thin"
