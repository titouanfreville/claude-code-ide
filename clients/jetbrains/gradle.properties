# The IDE ships its own Kotlin runtime and every plugin runs on it. Bundling a second
# copy is a classloader conflict waiting to happen, so nothing here depends on the
# stdlib by default: control-client declares it compileOnly, and the plugins compile
# against the platform's.
kotlin.stdlib.default.dependency = false

# The oldest platform the plugins support, and the one they compile against: building
# against the minimum is what makes `sinceBuild` a claim rather than a hope.
#
# 2025.3 because it is the first release with the terminal tab API that replaces the
# deprecated `createShellWidget` (TerminalToolWindowTabsManager, IJPL-211122).
platformVersion = 2025.3.6.1
sinceBuild = 253

pluginVersion = 0.1.4

org.gradle.jvmargs = -Xmx2g
org.gradle.caching = true
